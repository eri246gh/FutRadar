<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutRadar — Futebol sem complicação</title>
    <meta name="description" content="Jogos, resultados, tabelas e ferramentas para acompanhar o futebol. FutRadar — Futebol sem complicação.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2310b981'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script>
        // Aplicar tema salvo antes de renderizar para evitar flash
        (function() {
            const savedTheme = localStorage.getItem('futradar-theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div id="app">
        <header id="header-container"></header>
        <main id="main-content" aria-live="polite"></main>
        <footer id="footer-container"></footer>
    </div>
    <div id="toast-container" aria-live="assertive"></div>
    <div id="modal-container"></div>
    <noscript>
        <div style="text-align:center; padding: 2rem; font-family: sans-serif;">
            <h1>FutRadar</h1>
            <p>Este site requer JavaScript para funcionar. Ative o JavaScript no seu navegador.</p>
        </div>
    </noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
